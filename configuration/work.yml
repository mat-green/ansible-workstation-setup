---
allowed_executables: []
asdf_plugins:
  - nodejs
  - python
  # - ruby
  - terraform
# javascript_packages:
#   - license
#   - gitignore
#   - covgen
#   - react-native-cli
#   - create-react-app
#   - apollo
#   - generator-generator
#   - yo
dockitems_remove:
  - Safari
  - Messages
  - Mail
  - Maps
  - Photos
  - FaceTime
  - Calendar
  - Contacts
  - Reminders
  - Notes
  - Freeform
  - TV
  - Music
  - News
  - Keynote
  - Numbers
  - Pages
  - Podcasts
  - Books
dockitems_persist:
  - name: iTerm
    path: "/Applications/iTerm.app/"
    pos: 2
  - name: Obsidian
    path: "/Applications/Obsidian.app/"
    pos: 3
  - name: Visual Studio Code
    path: "/Applications/Visual Studio Code.app/"
    pos: 4
  - name: Slack
    path: "/Applications/Slack.app/"
    pos: 5
  - name: Microsoft Teams
    path: "/Applications/Microsoft Teams.localized/Microsoft Teams.app/"
    pos: 6
  - name: Microsoft Outlook
    path: "/Applications/Microsoft Outlook.app/"
    pos: 7
  - name: Spotify
    path: "/Applications/Spotify.app/"
    pos: 8
dotfiles_repo: "https://github.com/mat-green/dotfiles.git"
dotfiles_repo_version: osx-sequoia
dotfiles_files:
  - .zshrc.personal.before
  - .zshrc.personal.after
homebrew_cask_apps: # Search https://formulae.brew.sh/ for apps
  # - adobe-acrobat-reader # password
  #- canon-captureontouch-utility # password
  #- virtualbox # Password
  # - android-file-transfer
  # - balenaetcher
  # - drawio
  # - dropbox
  # - firefox
  # - flux
  - gimp
  # - grammarly
  - iterm2
  # - lens
  - obsidian
  # - pgadmin4
  - spotify
  - visual-studio-code
homebrew_installed_packages:  # Search https://formulae.brew.sh/ for packages
  - asdf
  - autoenv
  - cocoapods
  - gnu-tar
  - gawk
  - git
  - git-lfs
  - gpg
  - htop
  - jq
  - mas
  #- packer
  - podman # docker replacement
  - postgresql
  - pnpm
  - syncthing
  - terraform-ls
  - unzip
  - zsh
# homebrew_uninstalled_packages: []
# homebrew_taps:
#   - homebrew/cask-drivers
#   - homebrew/cask-versions
mas_signin_dialog: true
mas_installed_apps:
  - { id: 497799835, name: "Xcode" }
  # - { id: 402592703, name: "Time Out (2.6.2)" }
mas_uninstalled_apps: []
  # - { id: 408981434, name: "iMovie" }
  # - { id: 409183694, name: "Keynote" }
  # - { id: 409201541, name: "Pages" }
  # - { id: 409203825, name: "Numbers" }
  # - { id: 682658836, name: "GarageBand" }
macos_apps_install_list:
  - u: 'https://github.com/rxhanson/Rectangle/releases/download/v0.90/Rectangle0.90.dmg'
    f: 'Rectangle0.90.dmg'
    n: 'Rectangle'
  - u: 'https://cdn.azul.com/zulu/bin/zulu17.60.17-ca-jdk17.0.16-macosx_aarch64.dmg'
    f: 'zulu17.60.17-ca-jdk17.0.16-macosx_aarch64.dmg'
    n: 'zulu-17.jdk'
    t: 'installer'
    exec_name: 'Double-Click to Install Azul Zulu JDK 17.pkg'
    to: '/Library/Java/JavaVirtualMachines'
  - u: 'https://redirector.gvt1.com/edgedl/android/studio/install/2025.1.3.7/android-studio-2025.1.3.7-mac_arm.dmg'
    f: 'android-studio-2025.1.3.7-mac_arm.dmg'
    n: 'Android Studio'
    to: '/Applications'
  - u: 'https://www.figma.com/download/desktop/mac'
    f: 'Figma.dmg'
    n: 'Figma'
    to: '/Applications'
install_archives: ~/Downloads
pip_path: /usr/bin/pip3    # Homebrew's pip: /opt/local/bin/pip
target_user_id: "{{ lookup('env', 'USER') }}"      # the name of the user we want the apps to belong to
verbose: false
vscode_extensions: []
